@if (label && showLabel) {
    <label class="flex items-center gap-1 mb-2" [attr.for]="id || null">
        <span>{{ label }}</span>
        @if (required) {
            <span class="text-red-500">*</span>
        }
    </label>
}

<p-password
    #pwd
    [inputId]="id"
    class="w-full"
    [size]="size"
    inputStyleClass="w-full"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [disabled]="isDisabled"
    [toggleMask]="toggleMask"
    [feedback]="feedback"
    [promptLabel]="promptLabel"
    [weakLabel]="weakLabel"
    [mediumLabel]="mediumLabel"
    [strongLabel]="strongLabel"
    [ngClass]="setNgClass"
    [invalid]="validatorMessage && (submitted || isInvalid)"
    [(ngModel)]="value"
    (ngModelChange)="onModelChange($event)"
    (onBlur)="onBlurInternal()"
    (keydown.enter)="$event.preventDefault(); $event.stopPropagation(); enterKeyUp()"
    (keyup.ArrowLeft)="arrowLeftKeyUp()"
></p-password>

<error-message [label]="label" [controls]="controls" [validatorMessage]="validatorMessage" [isInvalid]="submitted || isInvalid"></error-message>
