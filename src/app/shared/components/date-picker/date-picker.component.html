@if (label() && showLabel()) {
    <label class="flex items-center gap-1 mb-2" [attr.for]="id() || null">
        <span>{{ label() }}</span>
        @if (required()) {
            <span class="text-red-500">*</span>
        }
    </label>
}

<p-datepicker
    #inputEl
    styleClass="w-full"
    [inputId]="id() || undefined"
    [placeholder]="placeholder()"
    [disabled]="isDisabled"
    [readonlyInput]="readonly() || readonlyInput()"
    [ngClass]="setNgClass()"
    [class.ng-invalid]="(submitted() || isInvalid) && validatorMessage()"
    [class.ng-dirty]="(submitted() || isInvalid) && validatorMessage()"
    [showIcon]="showIcon()"
    [showButtonBar]="showButtonBar()"
    [dateFormat]="dateFormat()"
    [selectionMode]="selectionMode()"
    [minDate]="minDate() ?? null"
    [maxDate]="maxDate() ?? null"
    [showTime]="showTime()"
    [hourFormat]="hourFormat()"
    [appendTo]="appendTo() ?? 'body'"
    [(ngModel)]="value"
    (onSelect)="onSelect($event)"
    (onInput)="onInputEvent()"
    (onBlur)="onBlur()"
    (keydown.enter)="$event.preventDefault(); $event.stopPropagation(); enterKeyUp()"
    (keyup.ArrowLeft)="arrowLeftKeyUp()"
></p-datepicker>

<error-message [label]="label()" [controls]="controls" [validatorMessage]="validatorMessage()" [isInvalid]="submitted() || isInvalid"></error-message>
