@if (label && showLabel) {
    <label class="flex items-center gap-1 mb-2" [attr.for]="id || null">
        <span>{{ label }}</span>
        @if (required) {
            <span class="text-red-500">*</span>
        }
    </label>
}

<input
    #inputEl
    pInputText
    type="text"
    class="w-full"
    [id]="id || null"
    [placeholder]="placeholder"
    [attr.autocomplete]="autocomplete"
    [disabled]="isDisabled"
    [readonly]="readonly"
    [ngClass]="setNgClass"
    [class.ng-invalid]="(submitted || isInvalid) && validatorMessage"
    [class.ng-dirty]="(submitted || isInvalid) && validatorMessage"
    [(ngModel)]="value"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur($any($event.target).value)"
    (keydown.enter)="$event.preventDefault(); $event.stopPropagation(); enterKeyUp()"
    (keyup.ArrowLeft)="arrowLeftKeyUp()"
/>

<error-message [label]="label" [controls]="controls" [validatorMessage]="validatorMessage" [isInvalid]="submitted || isInvalid"></error-message>
