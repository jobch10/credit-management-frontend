<div class="flex items-center justify-between mb-4 pb-4">
    <div class="flex items-center gap-3">
        <div class="flex items-center justify-center bg-blue-100 dark:bg-blue-400/10 rounded-border shrink-0" style="width: 2.5rem; height: 2.5rem">
            <i [class]="icon()" class="text-blue-500 text-xl!"></i>
        </div>
        <div class="flex items-center gap-2">
            <h5 class="font-semibold text-xl m-0! leading-tight">{{ title() }}</h5>
            @if (subtitle()) {
                <span class="text-xs text-muted-color align-sub pt-3">{{ subtitle() }}</span>
            }
        </div>
    </div>
    <div class="flex items-center gap-2">
        @if (showClearFilter()) {
            <ui-button icon="pi pi-filter-slash" (onClick)="clearFilter.emit()" pTooltip="Limpiar filtros" />
        }
        <ng-content select="[headerActions]"></ng-content>
    </div>
</div>
