<div class="card card-full">
    <page-header title="Inversionistas" [subtitle]="subtitle" icon="pi pi-briefcase" />

    <ui-table-customizable
        [data]="data()"
        [columns]="columns"
        [rowButtons]="rowButtons()"
        [globalFilterFields]="globalFilterFields"
        [showAddButton]="!!addButton"
        [loading]="loading()"
        [dataKey]="dataKey"
        [showActions]="actions().length > 0"
        (onAdd)="onAdd()"
        (rowAction)="onRowAction($event)"
    />

    <sc-document-manager [(visible)]="documentModalVisible" [entity]="'person'" [entityId]="selectedClientId()" [title]="'Documentos: ' + selectedClientName()" />
</div>
