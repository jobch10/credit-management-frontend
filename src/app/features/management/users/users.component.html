<div class="card card-full">
    <page-header [title]="module()?.name" [subtitle]="subtitle" [icon]="module()?.icon" />

    <ui-table-customizable
        [data]="data()"
        [columns]="columns"
        [rowButtons]="rowButtons()"
        [globalFilterFields]="globalFilterFields"
        [showAddButton]="!!addButton"
        [loading]="loading()"
        [dataKey]="dataKey"
        [showActions]="actions().length > 0"
        (onAdd)="onAdd()"
        (rowAction)="onRowAction($event)"
    />

    <app-user-form-modal [(visible)]="formVisible" [id]="editingId()" (saved)="onSaved()" />
</div>
